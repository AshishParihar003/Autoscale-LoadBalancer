---
- name: Configure AutoScale Web Server
  hosts: webservers
  become: true
  gather_facts: true

  tasks:
    - name: Refresh apt package cache
      ansible.builtin.apt: 
        update_cache: true
        cache_valid_time: 3600

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
    - name: Ensure Nginx is running and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
